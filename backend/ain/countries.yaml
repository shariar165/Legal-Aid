# Destination-country registry: the countries where most Bangladeshi migrant workers go.
# One entry drives country detection (ingestion), routing (router), the wage calculator and
# the help line shown to the worker. Legal numbers (minimum wage, deduction cap) are only
# listed when the cited corpus section states them; tests/test_countries.py checks this.
#
# of:        possessive form, for sentences like "below Malaysia's minimum wage"
# aliases:   words that place the job in this country (matched on whole words, NFC-normalised)
# currency:  the code facts use for this country's money; currency_aliases are how contracts write it
# pack:      the Jurisdiction Router pack with this country's law excerpts
# min_wage / deduction_cap: null when our corpus has no official text for the figure

- code: SA
  name: {en: Saudi Arabia, bn: সৌদি আরব}
  of: {en: "Saudi Arabia's", bn: সৌদি আরবের}
  aliases: [saudi arabia, saudi, ksa, kingdom of saudi arabia, riyadh, jeddah, jiddah, dammam, makkah, mecca, madinah, medina, সৌদি, রিয়াদ, জেদ্দা]
  currency: SAR
  currency_aliases: [sar, riyal, riyals, saudi riyal]
  pack: sa_labour
  label: Saudi Labor Law (Royal Decree M/51)
  min_wage: null
  deduction_cap: {pct: 50, citation_id: SA-LABOR-2005-a93}
  help: {en: "Labour Wing, Bangladesh Embassy in Riyadh / Consulate General in Jeddah", bn: "শ্রম উইং, বাংলাদেশ দূতাবাস রিয়াদ / কনস্যুলেট জেনারেল জেদ্দা"}

