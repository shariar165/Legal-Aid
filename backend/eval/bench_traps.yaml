# Labelled trap set for eval/bench_quality.py: claim/statute pairs with a known right answer.
# The statute text always comes from the corpus by citation_id; only the propositions and contract findings are written
# here. `expect` is what the bench must decide from the text alone:
#   supports     the text states the proposition                          (kind: correct)
#   neutral      the text is about something else                         (kind: wrong_section)
#   contradicts  the text says otherwise: other numbers, or a proviso      (kind: contradicted, proviso)
#                or exception defeats the claimed rule
#   dropped      the act is repealed: the currency gate drops the claim before any judge sees it  (kind: repealed)
# For neutral/contradicts traps the hard requirement is "not supports"; the exact label is reported separately.
# `bangla: true` marks a Bangla statute text (checked against the corpus by the eval).

